<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 - Page Not Found | Buy &amp; Sell GH</title>
    <style>
      :root {
        --bg: #000000;
        --card: #111111;
        --text: #f5f5f7;
        --muted: #86868b;
        --gold: #d4af37;
        --gold-hover: #e5c158;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 48px 32px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      }
      .badge {
        display: inline-block;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 16px;
      }
      h1 {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
      }
      p {
        font-size: 15px;
        color: var(--muted);
        line-height: 1.5;
        margin-bottom: 28px;
      }
      a.button {
        display: inline-block;
        background: var(--gold);
        color: #000000;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 980px;
        transition: background 0.2s ease, transform 0.1s ease;
      }
      a.button:hover {
        background: var(--gold-hover);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">Error 404</span>
      <h1>Page Not Found</h1>
      <p>The page you are looking for does not exist, has been moved, or is not available on this address.</p>
      <a class="button" href="/">Return to Storefront</a>
    </div>
  </body>
</html>
